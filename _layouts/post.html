---
layout: default
---
<article class="post">
  <div class="wrap wrap-narrow">
    <a class="back-link" href="{{ '/news.html' | relative_url }}">← All news</a>
    {% if page.tag %}<span class="tag tag-{{ page.tag | slugify }}">{{ page.tag }}</span>{% endif %}
    <h1>{{ page.title }}</h1>
    <p class="post-meta">{{ page.date | date: "%Y.%m.%d" }}</p>
    {% if page.image %}
      <img class="post-hero-img" src="{{ page.image | relative_url }}" alt="{{ page.title }}">
    {% endif %}
    <div class="post-body">
      {{ content }}
    </div>
  </div>
</article>
